steps:
  # Build the backend container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/legallense-backend:$COMMIT_SHA', './backend']
  
  # Push the backend container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/legallense-backend:$COMMIT_SHA']
    
  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'legallense-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/legallense-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # You can add backend-specific environment variables here if needed
      # - '--set-env-vars'
      # - 'DB_HOST=...,DB_USER=...'

  # Build the frontend container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/legallense-frontend:$COMMIT_SHA', './frontend']
    
  # Push the frontend container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/legallense-frontend:$COMMIT_SHA']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'legallense-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/legallense-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # You may need to inject backend URL to the frontend via environment variables
      # - '--set-env-vars'
      # - 'VITE_API_URL=...'

images:
  - 'gcr.io/$PROJECT_ID/legallense-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/legallense-frontend:$COMMIT_SHA'
